name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          build-args: --project "NetPadlock" --org "com.jhondecosta.padlock" --arch arm64-v8a

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: padlock-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
